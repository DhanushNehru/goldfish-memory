site_name: Goldfish Memory
site_description: Local-first memory for AI agents
site_url: https://dhanushnehru.github.io/goldfish-memory/
repo_url: https://github.com/DhanushNehru/goldfish-memory
repo_name: DhanushNehru/goldfish-memory

docs_dir: docs

theme:
  name: material
  font: false

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - src
          options:
            docstring_style: google
            show_source: false
            members_order: source

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - CLI Reference: cli.md
  - API Reference: api.md

strict: true